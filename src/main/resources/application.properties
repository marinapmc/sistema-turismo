spring.datasource.url=jdbc:postgresql://localhost:5432/turismo
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

# Upload de arquivos
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.web.resources.static-locations=classpath:/static/,file:./uploads/

# E-mail (configure MAIL_USER e MAIL_PASS como variáveis de ambiente)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:noreply@sistema-turismo.com}
spring.mail.password=${MAIL_PASS:senha}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Admin credentials
app.admin.email=admin@sistema.com
app.admin.senha=admin123

# i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# Evita que a resolução de mensagens dependa do locale do sistema operacional onde o servidor
# roda (ex: dentro do WSL o locale padrão da JVM cai para "en" por causa de LANG=C.UTF-8,
# fazendo a aplicação usar messages_en.properties mesmo com o idioma da sessão em pt-BR)
spring.messages.fallback-to-system-locale=false
