<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{page.erro})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container text-center py-5">
    <h1 class="display-1 text-danger" th:text="${status}">500</h1>
    <h2 class="mb-3" th:text="#{erro.titulo}">Ops! Algo deu errado.</h2>
    <p class="lead" th:text="${mensagem}">Ocorreu um erro inesperado.</p>
    <a th:href="@{/}" class="btn btn-primary" th:text="#{erro.voltar}">Voltar ao início</a>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
