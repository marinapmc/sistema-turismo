<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{page.login})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container" style="max-width:420px">
    <h2 class="mb-4" th:text="#{login.titulo}">Entrar</h2>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label" th:text="#{login.email}">E-mail</label>
            <input type="email" name="username" class="form-control" required autofocus/>
        </div>
        <div class="mb-3">
            <label class="form-label" th:text="#{login.senha}">Senha</label>
            <input type="password" name="password" class="form-control" required/>
        </div>
        <button type="submit" class="btn btn-primary w-100" th:text="#{login.entrar}">Entrar</button>
    </form>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
