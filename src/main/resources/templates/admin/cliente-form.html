<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{page.clientes})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container" style="max-width:600px">
    <h2 class="mb-4" th:text="${cliente.id} != null ? #{form.editarCliente} : #{form.novoCliente}">Cliente</h2>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <form th:action="${cliente.id} != null ? @{/admin/clientes/editar/{id}(id=${cliente.id})} : @{/admin/clientes/novo}"
          th:object="${cliente}" method="post">

        <div class="mb-3">
            <label class="form-label" th:text="#{campo.nome}">Nome</label>
            <input type="text" th:field="*{nome}" class="form-control"
                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{nome}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="#{campo.email}">E-mail</label>
            <input type="email" th:field="*{email}" class="form-control"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                   th:readonly="${cliente.id} != null"/>
            <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>

        <div class="mb-3" th:if="${cliente.id} == null">
            <label class="form-label" th:text="#{campo.senha}">Senha</label>
            <input type="password" th:field="*{senha}" class="form-control"
                   th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{senha}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="#{campo.cpf}">CPF (11 dígitos)</label>
            <input type="text" th:field="*{cpf}" class="form-control" maxlength="11"
                   th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'"
                   th:readonly="${cliente.id} != null"/>
            <div class="invalid-feedback" th:errors="*{cpf}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="#{campo.telefone}">Telefone</label>
            <input type="text" th:field="*{telefone}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="#{campo.sexo}">Sexo</label>
            <select th:field="*{sexo}" class="form-select">
                <option value="" th:text="#{campo.selecione}">Selecione</option>
                <option th:each="s : ${sexos}" th:value="${s}" th:text="${s}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label" th:text="#{campo.dataNascimento}">Data de Nascimento</label>
            <input type="date" th:field="*{dataNascimento}" class="form-control"
                   th:classappend="${#fields.hasErrors('dataNascimento')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{dataNascimento}"></div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" th:text="#{btn.salvar}">Salvar</button>
            <a th:href="@{/admin/clientes}" class="btn btn-secondary" th:text="#{btn.cancelar}">Cancelar</a>
        </div>
    </form>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
