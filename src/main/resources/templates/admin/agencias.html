<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{page.agencias})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="#{page.agencias}">Agências</h2>
        <a th:href="@{/admin/agencias/nova}" class="btn btn-success" th:text="#{btn.novo}">Nova</a>
    </div>

    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <table class="table table-striped">
        <thead>
            <tr>
                <th th:text="#{campo.nome}">Nome</th>
                <th th:text="#{campo.email}">E-mail</th>
                <th th:text="#{campo.cnpj}">CNPJ</th>
                <th th:text="#{campo.acoes}">Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="a : ${agencias}">
                <td th:text="${a.nome}"></td>
                <td th:text="${a.email}"></td>
                <td th:text="${a.cnpj}"></td>
                <td>
                    <a th:href="@{/admin/agencias/editar/{id}(id=${a.id})}" class="btn btn-sm btn-warning" th:text="#{btn.editar}">Editar</a>
                    <form th:action="@{/admin/agencias/excluir/{id}(id=${a.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Confirmar exclusão?')">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-danger" th:text="#{btn.excluir}">Excluir</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(agencias)}">
                <td colspan="4" class="text-center" th:text="#{msg.nenhumRegistro}">Nenhuma agência cadastrada.</td>
            </tr>
        </tbody>
    </table>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
