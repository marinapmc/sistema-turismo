<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(#{page.pacotes})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>

    <h2 th:text="${pacote.cidade + ', ' + pacote.estado + ', ' + pacote.pais}"></h2>
    <p class="text-muted" th:text="${pacote.agencia.nome}"></p>

    <!-- Galeria de fotos -->
    <div class="row g-2 mb-4" th:if="${pacote.fotos != null and !pacote.fotos.isEmpty()}">
        <div class="col-md-3" th:each="foto : ${pacote.fotos}">
            <img th:src="@{/{f}(f=${foto})}" class="img-fluid rounded" alt="foto"/>
        </div>
    </div>

    <ul class="list-group list-group-flush mb-4">
        <li class="list-group-item">
            <strong th:text="#{campo.dataPartida}">Partida:</strong>
            <span th:text="${#temporals.format(pacote.dataPartida, 'dd/MM/yyyy')}"></span>
        </li>
        <li class="list-group-item">
            <strong th:text="#{campo.duracao}">Duração:</strong>
            <span th:text="${pacote.duracao + ' dias'}"></span>
        </li>
        <li class="list-group-item">
            <strong th:text="#{campo.valor}">Valor:</strong>
            <span th:text="${'R$ ' + #numbers.formatDecimal(pacote.valor, 1, 2)}"></span>
        </li>
        <li class="list-group-item">
            <strong th:text="#{campo.vagas}">Vagas disponíveis:</strong>
            <span th:text="${pacote.vagasDisponiveis}"
                  th:class="${pacote.vagasDisponiveis <= 0} ? 'text-danger fw-bold' : ''"></span>
        </li>
        <li class="list-group-item" th:if="${pacote.roteiroPdf != null}">
            <a th:href="@{/{pdf}(pdf=${pacote.roteiroPdf})}" target="_blank" th:text="#{btn.verRoteiro}">Ver Roteiro (PDF)</a>
        </li>
    </ul>

    <!-- Botão comprar (apenas cliente logado, e só se ainda houver vaga) -->
    <div sec:authorize="hasRole('CLIENTE')">
        <form th:if="${pacote.vagasDisponiveis > 0}" th:action="@{/compras/novo/{id}(id=${pacote.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-success btn-lg" th:text="#{btn.comprar}">Comprar</button>
        </form>
        <button th:unless="${pacote.vagasDisponiveis > 0}" type="button" class="btn btn-secondary btn-lg" disabled
                th:text="#{msg.esgotado}">Esgotado</button>
    </div>

    <div sec:authorize="!isAuthenticated()" class="mt-3">
        <a th:href="@{/login}" class="btn btn-outline-primary" th:text="#{msg.loginParaComprar}">Faça login para comprar</a>
    </div>

    <a th:href="@{/pacotes}" class="btn btn-link mt-3" th:text="#{btn.voltar}">← Voltar</a>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
