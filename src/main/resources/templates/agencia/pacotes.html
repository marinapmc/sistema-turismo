<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{page.meusPacotes})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="#{page.meusPacotes}">Meus Pacotes</h2>
        <a th:href="@{/agencia/pacotes/novo}" class="btn btn-success" th:text="#{btn.novoPacote}">Novo Pacote</a>
    </div>

    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <!-- Filtro vigentes -->
    <div class="mb-3">
        <a th:href="@{/agencia/pacotes}" class="btn btn-outline-secondary btn-sm" th:text="#{btn.todos}">Todos</a>
        <a th:href="@{/agencia/pacotes(vigentes=true)}" class="btn btn-outline-primary btn-sm" th:text="#{btn.vigentes}">Apenas Vigentes</a>
    </div>

    <table class="table table-striped">
        <thead>
            <tr>
                <th th:text="#{campo.destino}">Destino</th>
                <th th:text="#{campo.dataPartida}">Partida</th>
                <th th:text="#{campo.duracao}">Duração</th>
                <th th:text="#{campo.valor}">Valor</th>
                <th th:text="#{campo.acoes}">Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${pacotes}">
                <td th:text="${p.cidade + ', ' + p.estado + ', ' + p.pais}"></td>
                <td th:text="${#temporals.format(p.dataPartida, 'dd/MM/yyyy')}"></td>
                <td th:text="${p.duracao + ' dias'}"></td>
                <td th:text="${'R$ ' + #numbers.formatDecimal(p.valor, 1, 2)}"></td>
                <td>
                    <a th:href="@{/pacotes/{id}(id=${p.id})}" class="btn btn-sm btn-info" th:text="#{btn.ver}">Ver</a>
                    <form th:action="@{/agencia/pacotes/excluir/{id}(id=${p.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Confirmar exclusão?')">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-danger" th:text="#{btn.excluir}">Excluir</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(pacotes)}">
                <td colspan="5" class="text-center" th:text="#{msg.nenhumRegistro}">Nenhum pacote.</td>
            </tr>
        </tbody>
    </table>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
