<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{form.novoPacote})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container" style="max-width:700px">
    <h2 class="mb-4" th:text="#{form.novoPacote}">Novo Pacote</h2>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <form th:action="@{/agencia/pacotes/novo}" th:object="${pacote}" method="post"
          enctype="multipart/form-data">

        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label" th:text="#{campo.cidade}">Cidade</label>
                <input type="text" th:field="*{cidade}" class="form-control"
                       th:classappend="${#fields.hasErrors('cidade')} ? 'is-invalid'"/>
                <div class="invalid-feedback" th:errors="*{cidade}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" th:text="#{campo.estado}">Estado</label>
                <input type="text" th:field="*{estado}" class="form-control"
                       th:classappend="${#fields.hasErrors('estado')} ? 'is-invalid'"/>
                <div class="invalid-feedback" th:errors="*{estado}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" th:text="#{campo.pais}">País</label>
                <input type="text" th:field="*{pais}" class="form-control"
                       th:classappend="${#fields.hasErrors('pais')} ? 'is-invalid'"/>
                <div class="invalid-feedback" th:errors="*{pais}"></div>
            </div>

            <div class="col-md-4">
                <label class="form-label" th:text="#{campo.dataPartida}">Data de Partida</label>
                <input type="date" th:field="*{dataPartida}" class="form-control"
                       th:classappend="${#fields.hasErrors('dataPartida')} ? 'is-invalid'"/>
                <div class="invalid-feedback" th:errors="*{dataPartida}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" th:text="#{campo.duracao}">Duração (dias)</label>
                <input type="number" th:field="*{duracao}" class="form-control" min="1"
                       th:classappend="${#fields.hasErrors('duracao')} ? 'is-invalid'"/>
                <div class="invalid-feedback" th:errors="*{duracao}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" th:text="#{campo.valor}">Valor (R$)</label>
                <input type="number" th:field="*{valor}" class="form-control" step="0.01" min="0.01"
                       th:classappend="${#fields.hasErrors('valor')} ? 'is-invalid'"/>
                <div class="invalid-feedback" th:errors="*{valor}"></div>
            </div>

            <div class="col-12">
                <label class="form-label" th:text="#{campo.fotos}">Fotos (máx. 10)</label>
                <input type="file" name="fotosUpload" class="form-control" multiple accept="image/*"/>
            </div>
            <div class="col-12">
                <label class="form-label" th:text="#{campo.roteiro}">Roteiro (PDF)</label>
                <input type="file" name="roteiro" class="form-control" accept=".pdf"/>
            </div>
        </div>

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary" th:text="#{btn.salvar}">Salvar</button>
            <a th:href="@{/agencia/pacotes}" class="btn btn-secondary" th:text="#{btn.cancelar}">Cancelar</a>
        </div>
    </form>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
